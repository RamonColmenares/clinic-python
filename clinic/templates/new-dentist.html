{% extends "base.html" %}
{% block title %}Agregar odontólogo · Clinic Turnos{% endblock %}
{% block page_name %}new-dentist{% endblock %}
{% block content %}
  <div class="page-heading"><div><p class="eyebrow">CLÍNICA</p><h1>Agregar odontólogo</h1></div><a class="button secondary" href="/odontologos.html">Volver a la lista</a></div>
  <p id="response" class="notice" role="status" hidden></p>
  <section class="panel form-panel">
    <form id="create-form" data-entity="dentist">
      <label>Nombre<input name="nombre" required></label>
      <label>Apellido<input name="apellido" required></label>
      <label>Matrícula<input name="matricula"></label>
      <div class="form-actions"><button type="submit">Guardar odontólogo</button></div>
    </form>
  </section>
{% endblock %}
