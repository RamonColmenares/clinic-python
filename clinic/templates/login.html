<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar · Clinic Turnos</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="login-page">
  <main class="login-card">
    <a class="brand" href="/">Clinic Turnos</a>
    <h1>Iniciar sesión</h1>
    <p class="muted">Ingresa con la cuenta creada en este equipo.</p>
    {% if error %}<p class="notice error" role="alert">{{ error }}</p>{% endif %}
    <form action="/login{% if request.args.get('next') %}?next={{ request.args.get('next')|urlencode }}{% endif %}" method="post">
      <label for="username">Usuario</label>
      <input id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Ingresar</button>
    </form>
  </main>
</body>
</html>
