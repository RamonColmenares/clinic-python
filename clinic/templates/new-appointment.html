{% extends "base.html" %}
{% block title %}Agregar turno · Clinic Turnos{% endblock %}
{% block page_name %}new-appointment{% endblock %}
{% block content %}
  <div class="page-heading"><div><p class="eyebrow">CLÍNICA</p><h1>Agregar turno</h1></div><a class="button secondary" href="/turnos.html">Volver a la lista</a></div>
  <p id="response" class="notice" role="status" hidden></p>
  <section class="panel form-panel">
    <form id="create-form" data-entity="appointment">
      <label>Odontólogo<select name="odontologo" required><option value="">Selecciona un odontólogo</option></select></label>
      <label>Paciente<select name="paciente" required><option value="">Selecciona un paciente</option></select></label>
      <label>Fecha<input name="fecha" type="date" required></label>
      <div class="form-actions"><button type="submit">Guardar turno</button></div>
    </form>
  </section>
{% endblock %}
