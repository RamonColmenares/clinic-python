{% extends "base.html" %}
{% block title %}Agregar paciente · Clinic Turnos{% endblock %}
{% block page_name %}new-patient{% endblock %}
{% block content %}
  <div class="page-heading"><div><p class="eyebrow">CLÍNICA</p><h1>Agregar paciente</h1></div><a class="button secondary" href="/pacientes.html">Volver a la lista</a></div>
  <p id="response" class="notice" role="status" hidden></p>
  <section class="panel form-panel">
    <form id="create-form" data-entity="patient">
      <h2>Información general</h2>
      <div class="form-grid">
        <label>Nombre<input name="nombre" required></label>
        <label>Apellido<input name="apellido" required></label>
        <label>Email<input name="email" type="email"></label>
        <label>DNI<input name="dni" type="number"></label>
        <label>Fecha de ingreso<input name="fechaIngreso" type="date"></label>
      </div>
      <h2>Domicilio</h2>
      <div class="form-grid">
        <label>Calle<input name="calle"></label>
        <label>Altura<input name="numero" type="number"></label>
        <label>Localidad<input name="localidad"></label>
        <label>Provincia<input name="provincia"></label>
      </div>
      <div class="form-actions"><button type="submit">Guardar paciente</button></div>
    </form>
  </section>
{% endblock %}
